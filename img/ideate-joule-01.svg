  <text x="26" y="251" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9ca3af">ID: ACC-002</text>
  <rect x="222" y="230" width="44" height="20" rx="4" fill="white" stroke="#7c3aed" stroke-width="1"/>
  <text x="244" y="244" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle">Select</text>

  <!-- Row C -->
