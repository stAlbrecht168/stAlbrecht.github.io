  <!-- Input bar -->
  <rect x="14" y="394" width="262" height="34" rx="17" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9ca3af">Ask Joule...</text>
  <circle cx="260" cy="411" r="12" fill="#7c3aed"/>
  <path d="M255,411 L263,408 L260,411 L263,414 Z" fill="white"/>
  <line x1="253" y1="411" x2="262" y2="411" stroke="white" stroke-width="1.2"/>
</g>

