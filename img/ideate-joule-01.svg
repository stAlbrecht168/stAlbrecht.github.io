  <text x="143" y="314" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">20</text>
  <text x="185" y="314" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">40</text>
