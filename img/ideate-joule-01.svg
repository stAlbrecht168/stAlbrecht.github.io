<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560">
<defs>
  <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3b0764"/>
    <stop offset="55%" stop-color="#6d28d9"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5b21b6"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <clipPath id="c1"><rect width="290" height="462" rx="8"/></clipPath>
  <clipPath id="c2"><rect width="290" height="462" rx="8"/></clipPath>
  <clipPath id="c3"><rect width="290" height="462" rx="8"/></clipPath>
  <clipPath id="c4"><rect width="290" height="462" rx="8"/></clipPath>
  <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <polygon points="0,0 7,3.5 0,7" fill="#ec4899"/>
  </marker>
</defs>

<!-- Canvas background -->
<rect width="1300" height="560" fill="#eef0f3"/>

<!-- Top labels -->
<text x="185" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#555" text-anchor="middle">Enter Prompt</text>
<text x="495" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#555" text-anchor="middle">List Card with Items</text>
<text x="805" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#555" text-anchor="middle">Integration Card / Bar Chart</text>
<line x1="892" y1="46" x2="1034" y2="46" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="1115" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#555" text-anchor="middle">Analytical Card / Bar Chart</text>

<!-- ═══════════════ PANEL 1 — Joule Welcome ═══════════════ -->
<g transform="translate(40,65)" clip-path="url(#c1)">
  <!-- Panel base -->
  <rect width="290" height="462" rx="8" fill="#1e1b4b"/>
  <!-- Title bar -->
  <rect width="290" height="28" fill="#12103a"/>
  <!-- Traffic lights -->
  <circle cx="14" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="28" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="42" cy="14" r="5" fill="#28c840"/>
  <!-- Welcome body -->
  <rect y="28" width="290" height="434" fill="url(#bg1)"/>

  <!-- Joule star logo -->
  <g transform="translate(145,128)">
    <path fill-rule="evenodd" fill="white" opacity=".9" d="M0,-32 L8,-8 L32,0 L8,8 L0,32 L-8,8 L-32,0 L-8,-8 Z M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z"/>
  </g>

  <!-- Labels -->
  <text x="145" y="182" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="rgba(255,255,255,.45)" text-anchor="middle" letter-spacing="3">JOULE</text>
  <text x="145" y="208" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="rgba(255,255,255,.65)" text-anchor="middle">Hello [User name],</text>
  <text x="145" y="228" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">How can I help you?</text>

  <!-- Capability pills row 1 -->
  <rect x="16" y="250" width="118" height="26" rx="13" fill="rgba(255,255,255,.15)"/>
  <text x="75" y="267" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="white" text-anchor="middle">Summarize</text>
  <rect x="144" y="250" width="130" height="26" rx="13" fill="rgba(255,255,255,.15)"/>
  <text x="209" y="267" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="white" text-anchor="middle">Analyze data</text>

  <!-- Capability pills row 2 -->
  <rect x="16" y="284" width="108" height="26" rx="13" fill="rgba(255,255,255,.15)"/>
  <text x="70" y="301" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="white" text-anchor="middle">Create plan</text>
  <rect x="134" y="284" width="96" height="26" rx="13" fill="rgba(255,255,255,.15)"/>
  <text x="182" y="301" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="white" text-anchor="middle">Generate</text>

  <!-- Divider -->
  <line x1="16" y1="326" x2="274" y2="326" stroke="rgba(255,255,255,.15)" stroke-width="1"/>

  <!-- Input rect -->
  <rect x="14" y="336" width="262" height="40" rx="20" fill="rgba(255,255,255,.14)"/>
  <text x="32" y="361" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="rgba(255,255,255,.6)">Summarize all issues</text>
  <!-- Send button -->
  <circle cx="260" cy="356" r="14" fill="white"/>
  <path d="M254,356 L264,352 L260,356 L264,360 Z" fill="#7c3aed"/>
  <line x1="252" y1="356" x2="263" y2="356" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="145" y="450" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="rgba(255,255,255,.3)" text-anchor="middle">Joule uses AI. Always verify important results.</text>
</g>

<!-- ═══════════════ PANEL 2 — List Card ═══════════════ -->
<g transform="translate(350,65)" clip-path="url(#c2)">
