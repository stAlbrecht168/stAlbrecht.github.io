<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
<rect width="900" height="520" fill="white"/>

<!-- Title -->
<text x="40" y="55" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#111827">Portfolio Handling Epic — UX</text>

<!-- Step 1 -->
<text x="40" y="95" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">1.    PM creates EPIC in Portfolio tool with Label <tspan font-style="italic">"UX"</tspan> and adds the</text>
<text x="62" y="113" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">UX Designer as <tspan font-style="italic">"Contributor".</tspan></text>
<text x="62" y="129" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280">When no UX Designer assigned, coordinate with UX Chapter Lead for cross-topic items.</text>

<!-- Step 2 -->
<text x="40" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">2.    PM sets up kickoff meeting or uses regular meetings with UX Designer to</text>
<text x="62" y="175" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">align on topic and needed UX activities.</text>

<!-- Step 3 -->
<text x="40" y="204" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">3.    UX Designer creates</text>
<text x="198" y="204" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1a56db" text-decoration="underline">UX User Story</text>
<text x="303" y="204" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">and assigns to related Epic.</text>
<text x="62" y="221" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280">Note: Why, Problem description, Persona, Customer (Influence request etc.) part of EPIC</text>

<!-- Step 4 -->
<text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">4.    UX Designer adds component for market and team</text>
<text x="62" y="267" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280">e.g. CALM Implementation, SD, TM</text>

<!-- Step 5 -->
<text x="40" y="296" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#111827">5.    Definition of Done criteria UX in User Story</text>
<text x="62" y="315" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#374151">- Story Board / User Journey</text>
<text x="62" y="332" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#374151">- Design Concept &amp; Specification</text>
<text x="62" y="349" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#374151">- UX Consistency Check</text>
<text x="62" y="366" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#374151">- Accessibility Check</text>
<text x="62" y="383" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#374151">- Feasibility</text>

<!-- Note -->
<text x="62" y="408" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280" font-style="italic">Note: please use the description field to add links or comments</text>

<!-- Footer line -->
<text x="40" y="438" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#111827">When UX User Story is completed, the UX flag in Epic can be set.</text>

<!-- Right panel: UX User Story Template card illustration -->
<rect x="530" y="72" width="335" height="400" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<!-- Card header bar -->
<rect x="530" y="72" width="335" height="38" rx="6" fill="#354a5e"/>
<rect x="530" y="91" width="335" height="19" fill="#354a5e"/>
<text x="548" y="97" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="white" font-weight="600">[UX] &lt;UX UserStory&gt; Template</text>

<!-- Tab row -->
<rect x="530" y="110" width="335" height="28" fill="#e5e7eb"/>
<text x="548" y="129" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#374151">Details</text>
<rect x="548" y="121" width="36" height="2" fill="#1a56db"/>
<text x="596" y="129" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9ca3af">Activity</text>
<text x="644" y="129" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9ca3af">Design</text>
<text x="692" y="129" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9ca3af">Attachments</text>

