<!-- Done criteria checkboxes -->
<text x="548" y="248" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="600" fill="#374151">Definition of Done</text>

<!-- Checkbox rows -->
<rect x="548" y="256" width="11" height="11" rx="2" fill="white" stroke="#d1d5db" stroke-width="1"/>
