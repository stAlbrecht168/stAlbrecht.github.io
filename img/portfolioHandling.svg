<rect x="548" y="274" width="11" height="11" rx="2" fill="white" stroke="#d1d5db" stroke-width="1"/>
<text x="565" y="284" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#374151">Design Concept &amp; Specification</text>

<rect x="548" y="292" width="11" height="11" rx="2" fill="#1a56db" stroke="#1a56db" stroke-width="1"/>
<text x="552" y="302" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="white">✓</text>
<text x="565" y="302" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#374151">UX Consistency Check</text>

<rect x="548" y="310" width="11" height="11" rx="2" fill="white" stroke="#d1d5db" stroke-width="1"/>
<text x="565" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#374151">Accessibility Check</text>

<rect x="548" y="328" width="11" height="11" rx="2" fill="white" stroke="#d1d5db" stroke-width="1"/>
<text x="565" y="338" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#374151">Feasibility</text>

<!-- Description label -->
<line x1="530" y1="356" x2="865" y2="356" stroke="#e5e7eb" stroke-width="1"/>
<text x="548" y="376" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6b7280">Description</text>
<rect x="548" y="382" width="299" height="36" rx="3" fill="white" stroke="#d1d5db" stroke-width="1"/>
<text x="558" y="396" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#9ca3af">Add context, links, or references here...</text>

<!-- Attachments area -->
<line x1="530" y1="428" x2="865" y2="428" stroke="#e5e7eb" stroke-width="1"/>
<text x="548" y="446" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6b7280">Attachments</text>
<text x="548" y="460" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#9ca3af">Drop files to attach, or browse</text>
</svg>
