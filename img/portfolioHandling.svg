<text x="710" y="178" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#374151">CALM Implementation</text>

<text x="548" y="204" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6b7280">PM Epic</text>
<rect x="548" y="209" width="120" height="18" rx="2" fill="white" stroke="#d1d5db" stroke-width="1"/>

<text x="700" y="204" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6b7280">Sprint</text>
